<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="500" viewBox="0 0 1100 500">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151" />
    </marker>
    <style>
      .title      { font: 700 22px Segoe UI, Arial, sans-serif; fill: #1f2937; }
      .ptitle     { font: 700 18px Segoe UI, Arial, sans-serif; }
      .blabel     { font: 700 14px Segoe UI, Arial, sans-serif; fill: #1f2937; }
      .ilabel     { font: 600 13px Segoe UI, Arial, sans-serif; }
      .note       { font: 600 14px Segoe UI, Arial, sans-serif; }
      .alabel     { font: 500 12px Segoe UI, Arial, sans-serif; fill: #374151; }
      .conn       { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arr); }
    </style>
  </defs>

  <rect width="1100" height="500" fill="white" />

  <!-- Main title -->
  <text x="550" y="36" text-anchor="middle" class="title">BFF vs Standard SPA — Where Do Tokens Live?</text>

  <!-- ═══ LEFT PANEL: SPA without BFF ═══ -->
  <rect x="30" y="55" width="490" height="400" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" />
  <text x="275" y="92" text-anchor="middle" class="ptitle" fill="#dc2626">✗  SPA without BFF</text>

  <!-- Browser -->
  <rect x="100" y="125" width="280" height="160" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="2" />
  <text x="240" y="148" text-anchor="middle" class="blabel">Browser</text>
  <rect x="125" y="165" width="230" height="45" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
  <text x="240" y="195" text-anchor="middle" class="ilabel" fill="#1d4ed8">Angular (SPA)</text>
  <rect x="125" y="225" width="230" height="45" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" />
  <text x="240" y="255" text-anchor="middle" class="ilabel" fill="#dc2626">Access token in JS</text>

  <!-- Note -->
  <text x="275" y="365" text-anchor="middle" class="note" fill="#dc2626">Browser JavaScript has access</text>
  <text x="275" y="390" text-anchor="middle" class="note" fill="#b91c1c">to the token — exposed to XSS</text>
  <text x="275" y="415" text-anchor="middle" style="font: 500 12px Segoe UI, Arial, sans-serif; fill: #7f1d1d; font-style: italic;">No protection in front-channel can prevent JS access</text>

  <!-- ═══ RIGHT PANEL: With BFF ═══ -->
  <rect x="580" y="55" width="490" height="400" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />
  <text x="825" y="92" text-anchor="middle" class="ptitle" fill="#16a34a">✓  With BFF</text>

  <!-- Browser -->
  <rect x="610" y="125" width="220" height="160" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="2" />
  <text x="720" y="148" text-anchor="middle" class="blabel">Browser</text>
  <rect x="630" y="165" width="180" height="45" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
  <text x="720" y="195" text-anchor="middle" class="ilabel" fill="#1d4ed8">Angular (SPA)</text>
  <rect x="630" y="225" width="180" height="45" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text x="720" y="255" text-anchor="middle" class="ilabel" fill="#15803d">HttpOnly cookie</text>

  <!-- BFF Server -->
  <rect x="880" y="125" width="180" height="160" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="2" />
  <text x="970" y="148" text-anchor="middle" class="blabel">BFF Server</text>
  <rect x="900" y="165" width="140" height="45" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text x="970" y="195" text-anchor="middle" class="ilabel" fill="#15803d">session +</text>
  <rect x="900" y="225" width="140" height="45" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text x="970" y="255" text-anchor="middle" class="ilabel" fill="#15803d">access token</text>

  <!-- Arrow Browser → BFF -->
  <line x1="830" y1="205" x2="880" y2="205" class="conn" />
  <text x="855" y="197" text-anchor="middle" class="alabel">cookie</text>

  <!-- Note -->
  <text x="825" y="365" text-anchor="middle" class="note" fill="#16a34a">Token stays server-side;</text>
  <text x="825" y="390" text-anchor="middle" class="note" fill="#15803d">HttpOnly cookie cannot be read by JS</text>
  <text x="825" y="415" text-anchor="middle" style="font: 500 12px Segoe UI, Arial, sans-serif; fill: #15803d; font-style: italic;">Token kept in back-channel only—never exposed</text>

</svg>
