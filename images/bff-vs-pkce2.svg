<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151" />
    </marker>
    <style>
      .title      { font: 700 22px Segoe UI, Arial, sans-serif; fill: #1f2937; }
      .ptitle     { font: 700 18px Segoe UI, Arial, sans-serif; }
      .blabel     { font: 700 14px Segoe UI, Arial, sans-serif; fill: #1f2937; }
      .ilabel     { font: 600 13px Segoe UI, Arial, sans-serif; }
      .note       { font: 600 14px Segoe UI, Arial, sans-serif; }
      .alabel     { font: 500 12px Segoe UI, Arial, sans-serif; fill: #374151; }
      .conn       { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#arr); }
    </style>
  </defs>

  <!-- Main title -->
  <text x="550" y="36" text-anchor="middle" class="title">BFF vs PKCE — Where Do Tokens Live?</text>

  <!-- ═══ LEFT PANEL: Without BFF ═══ -->
  <rect x="30" y="55" width="490" height="490" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" />
  <text x="275" y="92" text-anchor="middle" class="ptitle" fill="#dc2626">✗  Without BFF (PKCE)</text>

  <!-- Browser -->
  <rect x="60" y="112" width="210" height="195" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="2" />
  <text x="165" y="135" text-anchor="middle" class="blabel">Browser</text>
  <rect x="80" y="144" width="170" height="48" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
  <text x="165" y="173" text-anchor="middle" class="ilabel" fill="#1d4ed8">Angular (SPA)</text>
  <rect x="80" y="204" width="170" height="48" rx="5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" />
  <text x="165" y="233" text-anchor="middle" class="ilabel" fill="#dc2626">⚠  access token</text>

  <!-- Auth Server -->
  <rect x="340" y="178" width="150" height="60" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" />
  <text x="415" y="213" text-anchor="middle" class="blabel" fill="#5b21b6">Auth Server</text>

  <!-- Arrow -->
  <line x1="270" y1="213" x2="340" y2="213" class="conn" />
  <text x="305" y="205" text-anchor="middle" class="alabel">PKCE</text>

  <!-- Note -->
  <text x="275" y="365" text-anchor="middle" class="note" fill="#dc2626">Token lives in the browser</text>
  <text x="275" y="389" text-anchor="middle" class="note" fill="#b91c1c">exposed to XSS, interception</text>

  <!-- ═══ RIGHT PANEL: With BFF ═══ -->
  <rect x="580" y="55" width="490" height="490" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />
  <text x="825" y="92" text-anchor="middle" class="ptitle" fill="#16a34a">✓  With BFF</text>

  <!-- Browser -->
  <rect x="610" y="112" width="185" height="195" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="2" />
  <text x="702" y="135" text-anchor="middle" class="blabel">Browser</text>
  <rect x="629" y="144" width="147" height="48" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
  <text x="702" y="173" text-anchor="middle" class="ilabel" fill="#1d4ed8">Angular (SPA)</text>
  <rect x="629" y="204" width="147" height="48" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text x="702" y="233" text-anchor="middle" class="ilabel" fill="#15803d">HttpOnly cookie</text>

  <!-- BFF Server -->
  <rect x="855" y="112" width="185" height="195" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="2" />
  <text x="947" y="135" text-anchor="middle" class="blabel">BFF Server</text>
  <rect x="874" y="144" width="147" height="48" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text x="947" y="173" text-anchor="middle" class="ilabel" fill="#15803d">session</text>
  <rect x="874" y="204" width="147" height="48" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text x="947" y="233" text-anchor="middle" class="ilabel" fill="#15803d">tokens (server-side)</text>

  <!-- Auth Server -->
  <rect x="855" y="375" width="185" height="60" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" />
  <text x="947" y="410" text-anchor="middle" class="blabel" fill="#5b21b6">Auth Server</text>

  <!-- Arrow Browser → BFF -->
  <line x1="795" y1="209" x2="855" y2="209" class="conn" />
  <text x="825" y="201" text-anchor="middle" class="alabel">cookie</text>

  <!-- Arrow BFF → Auth Server -->
  <line x1="947" y1="307" x2="947" y2="375" class="conn" />
  <text x="963" y="345" class="alabel">tokens</text>

  <!-- Note -->
  <text x="825" y="465" text-anchor="middle" class="note" fill="#16a34a">Tokens never reach the browser</text>
  <text x="825" y="489" text-anchor="middle" class="note" fill="#15803d">kept server-side, safe from XSS</text>

</svg>
