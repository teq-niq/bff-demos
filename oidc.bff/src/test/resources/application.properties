# ⚠️  WARNING: Do NOT commit real Okta credentials in this file.
#     This file contains stub values for test context startup only.
#     The oidcLogin() post-processor is used in tests to mock authentication —
#     no real Okta tenant is contacted during test execution.
#
# HOW TO RUN TESTS (no real Okta credentials needed):
#     mvn -pl bff-spring-projs/spring.oidc.bff test
#   or run individual test classes from your IDE (e.g., Eclipse JUnit Runner).
#
# IF YOU NEED TO OVERRIDE AT TEST TIME (e.g., CI/CD), pass via Maven system properties:
#     mvn -pl bff-spring-projs/spring.oidc.bff test
#       -Dspring.security.oauth2.client.registration.okta.client-id=real-id
#       -Dspring.security.oauth2.client.registration.okta.client-secret=real-secret
#       -Dspring.security.oauth2.client.provider.okta.jwk-set-uri=https://YOUR_TENANT/oauth2/default/v1/keys

# Spring Security OAuth2 properties supplied directly to bypass
# OktaOAuth2PropertiesMappingEnvironmentPostProcessor, which makes a network call
# to the Okta discovery endpoint at startup when okta.* properties are present.
spring.security.oauth2.client.registration.okta.client-id=test-client-id
spring.security.oauth2.client.registration.okta.client-secret=test-client-secret
spring.security.oauth2.client.registration.okta.scope=openid,profile,email
spring.security.oauth2.client.provider.okta.authorization-uri=https://test.example.com/oauth2/v1/authorize
spring.security.oauth2.client.provider.okta.token-uri=https://test.example.com/oauth2/v1/token
spring.security.oauth2.client.provider.okta.jwk-set-uri=https://test.example.com/oauth2/v1/keys
spring.security.oauth2.client.provider.okta.user-info-uri=https://test.example.com/oauth2/v1/userinfo
spring.security.oauth2.client.provider.okta.user-name-attribute=sub

# okta.* properties are intentionally OMITTED — do not add them here.
# They trigger OktaOAuth2PropertiesMappingEnvironmentPostProcessor which makes a
# live network call to the Okta discovery endpoint, failing tests without real credentials.
# okta.oauth2.issuer=
# okta.oauth2.client-id=
# okta.oauth2.client-secret=

# Reduce logging noise during tests
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN

# Prevent Springdoc SwaggerWelcomeWebMvc from mapping /swagger-ui.html,
# which conflicts with the app's custom SwaggerResourceController
springdoc.swagger-ui.enabled=false

# Maven resource-filtered properties — must be provided explicitly in tests
# since Maven filtering (@...@) does not run in the test context
application-description=@project.description@
application-version=@project.version@

application-description=@project.description@

application-version=@project.version@
